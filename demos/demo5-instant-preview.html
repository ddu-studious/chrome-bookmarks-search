<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 5 - 即时预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a1e;
      --bg-panel: #242428;
      --bg-hover: #2e2e34;
      --text: #f0f0f5;
      --text-muted: #8b8b9a;
      --accent: #5b8def;
      --accent-soft: rgba(91, 141, 239, 0.15);
      --border: rgba(255,255,255,0.08);
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    .container {
      width: 800px;
      height: 520px;
      display: grid;
      grid-template-columns: 500px 300px;
      background: var(--bg-panel);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .results-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    .search-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--text);
      outline: none;
      background: var(--bg);
      transition: all 0.2s;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); }

    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s;
    }

    .result-item:hover { background: var(--bg-hover); }
    .result-item.selected {
      background: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .result-favicon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-url {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      padding: 20px;
    }

    .preview-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 40px 20px;
    }

    .preview-placeholder.hidden { display: none; }

    .preview-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .preview-content.visible {
      display: flex;
    }

    .preview-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .preview-favicon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .preview-title-block {
      flex: 1;
      min-width: 0;
    }

    .preview-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    .preview-url {
      font-size: 12px;
      color: var(--accent);
      margin-top: 6px;
      word-break: break-all;
    }

    .preview-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .meta-tag {
      padding: 4px 10px;
      background: var(--bg-panel);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .meta-tag.highlight { color: var(--accent); font-weight: 500; }

    .preview-details {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-muted); }
    .detail-value { color: var(--text); }

    .results-list::-webkit-scrollbar,
    .preview-details::-webkit-scrollbar { width: 6px; }
    .results-list::-webkit-scrollbar-thumb,
    .preview-details::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="results-panel">
      <div class="search-header">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索书签、标签、历史、下载..." autocomplete="off">
      </div>
      <div class="results-list" id="resultsList"></div>
    </div>

    <div class="preview-panel">
      <div class="preview-placeholder" id="placeholder">
        <span style="font-size: 48px; margin-bottom: 16px;">🔍</span>
        <p>选择一项查看详情</p>
        <p style="font-size: 12px; margin-top: 8px;">使用 ↑↓ 或鼠标悬停切换</p>
      </div>
      <div class="preview-content" id="previewContent">
        <div class="preview-header">
          <div class="preview-favicon" id="previewFavicon">📄</div>
          <div class="preview-title-block">
            <div class="preview-title" id="previewTitle"></div>
            <div class="preview-url" id="previewUrl"></div>
            <div class="preview-meta" id="previewMeta"></div>
          </div>
        </div>
        <div class="preview-details" id="previewDetails"></div>
      </div>
    </div>
  </div>

  <script>
    const SOURCE_ICONS = { bookmark: '📚', tab: '🗂', history: '🕐', download: '⬇️' };
    const SOURCE_LABELS = { bookmark: '书签', tab: '标签', history: '历史', download: '下载' };

    const MOCK_DATA = [
      { id: 1, title: 'React 官方文档 - 中文', url: 'https://zh-hans.react.dev', source: 'bookmark',
        folderPath: '前端/框架', addedDate: '2024-01-15', visitCount: 89, lastVisited: '2小时前' },
      { id: 2, title: 'Vue.js 官方文档', url: 'https://cn.vuejs.org', source: 'bookmark',
        folderPath: '前端/框架', addedDate: '2023-11-20', visitCount: 156, lastVisited: '1天前' },
      { id: 3, title: 'GitHub - 当前标签页', url: 'https://github.com', source: 'tab',
        windowInfo: '窗口 1', pinned: false },
      { id: 4, title: '掘金 - 技术社区', url: 'https://juejin.cn', source: 'tab',
        windowInfo: '窗口 1', pinned: true },
      { id: 5, title: 'MDN Web 文档', url: 'https://developer.mozilla.org/zh-CN', source: 'history',
        visitCount: 203, lastVisited: '3小时前', visitFrequency: '每周 12 次' },
      { id: 6, title: 'Stack Overflow 中文', url: 'https://stackoverflow.blog/zh', source: 'history',
        visitCount: 67, lastVisited: '5天前', visitFrequency: '每周 3 次' },
      { id: 7, title: '前端性能优化指南', url: 'file:///Downloads/前端性能优化指南.pdf', source: 'download',
        fileSize: '2.4 MB', downloadDate: '2024-02-10', progress: 100 },
      { id: 8, title: 'TypeScript 入门教程', url: 'https://ts.xcatliu.com', source: 'bookmark',
        folderPath: '前端/TypeScript', addedDate: '2024-02-01', visitCount: 42, lastVisited: '1周前' },
      { id: 9, title: 'Chrome 扩展开发文档', url: 'https://developer.chrome.com/docs/extensions', source: 'bookmark',
        folderPath: '开发工具', addedDate: '2024-03-01', visitCount: 15, lastVisited: '昨天' },
      { id: 10, title: 'React Hooks 完全指南', url: 'https://react.dev/learn/hooks', source: 'history',
        visitCount: 28, lastVisited: '2天前', visitFrequency: '每周 5 次' },
    ];

    let filteredData = [];
    let selectedIndex = 0;

    function filterData(query) {
      if (!query.trim()) return MOCK_DATA;
      const q = query.toLowerCase();
      return MOCK_DATA.filter(item =>
        item.title.toLowerCase().includes(q) || item.url.toLowerCase().includes(q)
      );
    }

    function renderResults() {
      const query = document.getElementById('searchInput').value;
      filteredData = filterData(query);
      selectedIndex = Math.min(selectedIndex, Math.max(0, filteredData.length - 1));

      const container = document.getElementById('resultsList');
      container.innerHTML = filteredData.map((item, i) => `
        <div class="result-item ${i === selectedIndex ? 'selected' : ''}" data-index="${i}">
          <span class="result-favicon">${SOURCE_ICONS[item.source]}</span>
          <div class="result-info">
            <div class="result-title">${escapeHtml(item.title)}</div>
            <div class="result-url">${escapeHtml(item.url)}</div>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.result-item').forEach(el => {
        el.addEventListener('click', () => {
          selectedIndex = parseInt(el.dataset.index);
          renderResults();
          updatePreview();
        });
        el.addEventListener('mouseenter', () => {
          selectedIndex = parseInt(el.dataset.index);
          renderResults();
          updatePreview();
        });
      });

      const selectedEl = container.querySelector('.result-item.selected');
      if (selectedEl) selectedEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      updatePreview();
    }

    function updatePreview() {
      const placeholder = document.getElementById('placeholder');
      const content = document.getElementById('previewContent');
      const item = filteredData[selectedIndex];

      if (!item) {
        placeholder.classList.remove('hidden');
        content.classList.remove('visible');
        return;
      }

      placeholder.classList.add('hidden');
      content.classList.add('visible');

      document.getElementById('previewFavicon').textContent = SOURCE_ICONS[item.source];
      document.getElementById('previewTitle').textContent = item.title;
      document.getElementById('previewUrl').textContent = item.url;

      const metaHtml = `
        <span class="meta-tag">${SOURCE_LABELS[item.source]}</span>
        ${item.visitCount ? `<span class="meta-tag highlight">${item.visitCount} 次访问</span>` : ''}
        ${item.lastVisited ? `<span class="meta-tag">${item.lastVisited}</span>` : ''}
      `;
      document.getElementById('previewMeta').innerHTML = metaHtml;

      let detailsHtml = '';
      if (item.source === 'bookmark') {
        detailsHtml = `
          <div class="detail-row"><span class="detail-label">所在文件夹</span><span class="detail-value">${escapeHtml(item.folderPath || '-')}</span></div>
          <div class="detail-row"><span class="detail-label">添加日期</span><span class="detail-value">${escapeHtml(item.addedDate || '-')}</span></div>
          <div class="detail-row"><span class="detail-label">访问次数</span><span class="detail-value">${item.visitCount || 0}</span></div>
          <div class="detail-row"><span class="detail-label">最后访问</span><span class="detail-value">${escapeHtml(item.lastVisited || '-')}</span></div>
        `;
      } else if (item.source === 'tab') {
        detailsHtml = `
          <div class="detail-row"><span class="detail-label">所在窗口</span><span class="detail-value">${escapeHtml(item.windowInfo || '-')}</span></div>
          <div class="detail-row"><span class="detail-label">固定状态</span><span class="detail-value">${item.pinned ? '已固定' : '未固定'}</span></div>
        `;
      } else if (item.source === 'history') {
        detailsHtml = `
          <div class="detail-row"><span class="detail-label">访问次数</span><span class="detail-value">${item.visitCount || 0}</span></div>
          <div class="detail-row"><span class="detail-label">访问频率</span><span class="detail-value">${escapeHtml(item.visitFrequency || '-')}</span></div>
          <div class="detail-row"><span class="detail-label">最后访问</span><span class="detail-value">${escapeHtml(item.lastVisited || '-')}</span></div>
        `;
      } else if (item.source === 'download') {
        detailsHtml = `
          <div class="detail-row"><span class="detail-label">文件大小</span><span class="detail-value">${escapeHtml(item.fileSize || '-')}</span></div>
          <div class="detail-row"><span class="detail-label">下载日期</span><span class="detail-value">${escapeHtml(item.downloadDate || '-')}</span></div>
          <div class="detail-row"><span class="detail-label">下载进度</span><span class="detail-value">${item.progress || 100}%</span></div>
        `;
      }
      document.getElementById('previewDetails').innerHTML = detailsHtml;
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', () => { selectedIndex = 0; renderResults(); });
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); selectedIndex = Math.min(selectedIndex + 1, filteredData.length - 1); renderResults(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIndex = Math.max(selectedIndex - 1, 0); renderResults(); }
      else if (e.key === 'Enter' && filteredData[selectedIndex]) {
        e.preventDefault();
        console.log('打开:', filteredData[selectedIndex].url);
      }
    });

    renderResults();
  </script>
</body>
</html>
